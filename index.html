<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jornadas de Investigación 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --text: #1a1a1a;
    --muted: #6b7280;
    --line: #e5e7eb;
    --bg: #ffffff;
    --accent: #111827;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    font-size: 16px;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 3rem 1.5rem 5rem; }

  header {
    margin-bottom: 3rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 1.9rem; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 0.4rem; }
  header p { color: var(--muted); font-size: 1rem; }

  h2 {
    font-size: 1.1rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 3rem 0 1.5rem;
  }

  .days { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 2rem; }
  .days button {
    background: none;
    border: 1px solid var(--line);
    padding: 0.45rem 0.9rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.88rem;
    font-family: inherit;
    color: var(--muted);
    transition: all 0.15s;
  }
  .days button:hover { border-color: var(--muted); color: var(--text); }
  .days button.active { background: var(--accent); color: white; border-color: var(--accent); }

  .day { display: none; }
  .day.active { display: block; }

  .slot {
    display: grid;
    grid-template-columns: 130px 1fr;
    gap: 1.5rem;
    padding: 1.1rem 0;
    border-bottom: 1px solid var(--line);
  }
  .slot:last-child { border-bottom: none; }
  .slot time {
    font-size: 0.85rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    padding-top: 0.15rem;
  }
  .slot-body { display: flex; flex-direction: column; gap: 0.9rem; }
  .item h3 { font-size: 1rem; font-weight: 500; margin-bottom: 0.2rem; }
  .item p { font-size: 0.88rem; color: var(--muted); }
  .item .nota { font-size: 0.82rem; color: var(--muted); font-style: italic; }

  .slot[data-tipo="pausa"] .item h3 {
    font-weight: 400;
    color: var(--muted);
    font-style: italic;
  }
  .slot[data-tipo="destacado"] .item h3 { font-weight: 600; }

  @media (min-width: 700px) {
    .slot-body.split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
  }

  .speaker { padding: 1.5rem 0; border-bottom: 1px solid var(--line); }
  .speaker:last-child { border-bottom: none; }
  .speaker h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 0.15rem; }
  .speaker .country { font-size: 0.82rem; color: var(--muted); margin-bottom: 0.7rem; display: block; }
  .speaker p { font-size: 0.92rem; color: #374151; }

  footer {
    margin-top: 4rem;
    padding-top: 2rem;
    border-top: 1px solid var(--line);
    font-size: 0.85rem;
    color: var(--muted);
  }

  @media (max-width: 600px) {
    .wrap { padding: 2rem 1.2rem 4rem; }
    header h1 { font-size: 1.5rem; }
    .slot { grid-template-columns: 1fr; gap: 0.3rem; }
    .slot time { font-size: 0.8rem; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1 id="titulo"></h1>
    <p id="subtitulo"></p>
  </header>

  <section>
    <h2>Agenda</h2>
    <div class="days" id="days"></div>
    <div id="agenda"></div>
  </section>

  <section>
    <h2>Ponentes</h2>
    <div id="ponentes"></div>
  </section>

  <footer id="footer"></footer>
</div>

<script>
  const el = (tag, cls) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    return n;
  };

  function renderEvento(evento) {
    document.getElementById('titulo').textContent = evento.titulo;
    document.getElementById('subtitulo').textContent = `${evento.fechas} · ${evento.lugar}`;
    document.getElementById('footer').textContent =
      `${evento.titulo} · ${evento.lugar} · ${new Date().getFullYear()}`;
    document.title = evento.titulo;
  }

  function renderAgenda(agenda) {
    const daysBar = document.getElementById('days');
    const cont = document.getElementById('agenda');

    agenda.forEach((dia, i) => {
      // Botón de día
      const btn = el('button', i === 0 ? 'active' : '');
      btn.textContent = dia.etiqueta;
      btn.dataset.day = dia.id;
      btn.addEventListener('click', () => {
        daysBar.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        cont.querySelectorAll('.day').forEach(d => d.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('day-' + dia.id).classList.add('active');
      });
      daysBar.appendChild(btn);

      // Contenedor del día
      const dayDiv = el('div', 'day' + (i === 0 ? ' active' : ''));
      dayDiv.id = 'day-' + dia.id;

      dia.bloques.forEach(bloque => {
        const slot = el('div', 'slot');
        if (bloque.tipo) slot.dataset.tipo = bloque.tipo;

        const time = el('time');
        time.textContent = bloque.hora;
        slot.appendChild(time);

        const body = el('div', 'slot-body');
        if (bloque.items.length > 1) body.classList.add('split');

        bloque.items.forEach(item => {
          const div = el('div', 'item');
          const h3 = el('h3');
          h3.textContent = item.titulo;
          div.appendChild(h3);

          const meta = [item.ponente, item.lugar].filter(Boolean).join(' · ');
          if (meta) {
            const p = el('p');
            p.textContent = meta;
            div.appendChild(p);
          }
          if (item.nota) {
            const n = el('p', 'nota');
            n.textContent = item.nota;
            div.appendChild(n);
          }
          body.appendChild(div);
        });

        slot.appendChild(body);
        dayDiv.appendChild(slot);
      });

      cont.appendChild(dayDiv);
    });
  }

  function renderPonentes(ponentes) {
    const cont = document.getElementById('ponentes');
    ponentes.forEach(p => {
      const div = el('div', 'speaker');
      const h3 = el('h3');
      h3.textContent = p.nombre;
      div.appendChild(h3);

      const c = el('span', 'country');
      c.textContent = p.pais;
      div.appendChild(c);

      if (p.bio) {
        const bio = el('p');
        bio.textContent = p.bio;
        div.appendChild(bio);
      }
      cont.appendChild(div);
    });
  }

  fetch('datos.json')
    .then(res => res.json())
    .then(data => {
      renderEvento(data.evento);
      renderAgenda(data.agenda);
      renderPonentes(data.ponentes);
    })
    .catch(err => {
      document.getElementById('agenda').innerHTML =
        '<p style="color:#b91c1c">No se pudo cargar datos.json. Si abriste el archivo con doble clic, prueba desde GitHub Pages o un servidor local.</p>';
      console.error(err);
    });
</script>

</body>
</html>
