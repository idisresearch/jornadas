<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evento · Jornadas de Investigación</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="evento">

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-brand" id="nav-brand"></a>
    <ul class="nav-links" id="nav-links"></ul>
  </div>
</nav>
<div id="banner" class="banner"></div>
<header class="hero">
  <div class="wrap">
    <h1 id="evento-titulo"></h1>
    <p class="meta" id="evento-meta"></p>
  </div>
</header>

<section class="block">
  <div class="wrap">
    <h2>Sobre el evento</h2>
    <p class="lead" id="evento-desc"></p>

    <!-- 👇 Bloque RIPAISC -->
    <div class="red-card">
      <a href="https://www.ripaisc.net/" target="_blank" rel="noopener" class="red-card-link">
        <img src="img/ripaisc.png" alt="Red RIPAISC" class="red-card-logo">
        <div class="red-card-text">
          <span class="red-card-label">En el marco de</span>
          <span class="red-card-name">Red Iberoamericana para la Ingeniería de Software Cuántico (RIPAISC)</span>
        </div>
      </a>
    </div>
    <!-- ☝️ Fin bloque RIPAISC -->
  </div>
</section>

<footer>
  <div class="wrap footer-inner">
    <span id="footer-texto"></span>
    <span id="footer-enlaces"></span>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
