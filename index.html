<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jornadas de Investigación</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --color-acento: #2563eb;
    --color-texto: #1a1a1a;
    --color-texto-suave: #6b7280;
    --color-fondo: #ffffff;
    --color-fondo-suave: #f9fafb;
    --color-borde: #e5e7eb;
    --fuente: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --ancho-maximo: 860px;
    --radio-borde: 8px;
  }

  html { scroll-behavior: smooth; scroll-padding-top: 70px; }

  body {
    font-family: var(--fuente);
    background: var(--color-fondo);
    color: var(--color-texto);
    line-height: 1.6;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: var(--ancho-maximo);
    margin: 0 auto;
    padding: 0 1.5rem;
  }

  /* ---------- NAV ---------- */
  .nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: saturate(180%) blur(8px);
    border-bottom: 1px solid var(--color-borde);
  }
  .nav-inner {
    max-width: var(--ancho-maximo);
    margin: 0 auto;
    padding: 0.9rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.5rem;
  }
  .nav-brand {
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--color-texto);
    text-decoration: none;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .nav-links {
    display: flex;
    gap: 0.3rem;
    list-style: none;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nav-links::-webkit-scrollbar { display: none; }
  .nav-links a {
    display: inline-block;
    padding: 0.4rem 0.75rem;
    font-size: 0.88rem;
    color: var(--color-texto-suave);
    text-decoration: none;
    border-radius: var(--radio-borde);
    transition: color 0.15s, background 0.15s;
    white-space: nowrap;
  }
  .nav-links a:hover {
    color: var(--color-acento);
    background: var(--color-fondo-suave);
  }

  /* ---------- HERO ---------- */
  .hero {
    padding: 4.5rem 0 3rem;
    border-bottom: 1px solid var(--color-borde);
  }
  .hero h1 {
    font-size: 2.2rem;
    font-weight: 600;
    letter-spacing: -0.025em;
    line-height: 1.15;
    margin-bottom: 0.7rem;
  }
  .hero .meta {
    color: var(--color-texto-suave);
    font-size: 1.05rem;
  }
  .hero .meta span + span::before {
    content: " · ";
    margin: 0 0.35rem;
  }

  /* ---------- SECCIONES ---------- */
  section.block {
    padding: 3.5rem 0;
    border-bottom: 1px solid var(--color-borde);
  }
  section.block:last-of-type { border-bottom: none; }

  h2 {
    font-size: 1.05rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--color-texto-suave);
    margin-bottom: 1.5rem;
  }

  p.lead {
    font-size: 1.02rem;
    color: var(--color-texto);
    max-width: 62ch;
    margin-bottom: 0.8rem;
  }

  /* ---------- AGENDA ---------- */
  .days {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-bottom: 1.8rem;
  }
  .days button {
    background: none;
    border: 1px solid var(--color-borde);
    padding: 0.45rem 0.9rem;
    border-radius: var(--radio-borde);
    cursor: pointer;
    font-size: 0.88rem;
    font-family: inherit;
    color: var(--color-texto-suave);
    transition: all 0.15s;
  }
  .days button:hover { border-color: var(--color-texto-suave); color: var(--color-texto); }
  .days button.active {
    background: var(--color-texto);
    color: white;
    border-color: var(--color-texto);
  }

  .day { display: none; }
  .day.active { display: block; }

  .slot {
    display: grid;
    grid-template-columns: 130px 1fr;
    gap: 1.5rem;
    padding: 1.1rem 0;
    border-bottom: 1px solid var(--color-borde);
  }
  .slot:last-child { border-bottom: none; }
  .slot time {
    font-size: 0.85rem;
    color: var(--color-texto-suave);
    font-variant-numeric: tabular-nums;
    padding-top: 0.15rem;
  }
  .slot-body { display: flex; flex-direction: column; gap: 0.9rem; }
  .item h3 { font-size: 1rem; font-weight: 500; margin-bottom: 0.15rem; }
  .item p { font-size: 0.88rem; color: var(--color-texto-suave); }
  .item .nota { font-size: 0.82rem; font-style: italic; }
  .slot[data-tipo="pausa"] .item h3 {
    font-weight: 400;
    color: var(--color-texto-suave);
    font-style: italic;
  }
  .slot[data-tipo="destacado"] .item h3 { font-weight: 600; }

  @media (min-width: 700px) {
    .slot-body.split { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  }

  /* ---------- PONENTES ---------- */
  .speaker {
    padding: 1.5rem 0;
    border-bottom: 1px solid var(--color-borde);
  }
  .speaker:last-child { border-bottom: none; }
  .speaker h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 0.1rem; }
  .speaker .country {
    font-size: 0.82rem;
    color: var(--color-texto-suave);
    margin-bottom: 0.6rem;
    display: block;
  }
  .speaker p { font-size: 0.92rem; color: var(--color-texto-suave); }

  /* ---------- INSCRIPCIONES ---------- */
  .insc-items {
    display: grid;
    gap: 0.9rem;
    margin: 1.5rem 0 2rem;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  }
  .insc-item {
    padding: 1.1rem 1.2rem;
    border: 1px solid var(--color-borde);
    border-radius: var(--radio-borde);
    background: var(--color-fondo-suave);
  }
  .insc-item h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.2rem; }
  .insc-item p { font-size: 0.85rem; color: var(--color-texto-suave); }

  .btn {
    display: inline-block;
    padding: 0.7rem 1.3rem;
    background: var(--color-acento);
    color: white;
    text-decoration: none;
    border-radius: var(--radio-borde);
    font-size: 0.92rem;
    font-weight: 500;
    transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.88; }

  /* ---------- MAPA ---------- */
  .map-embed {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 1px solid var(--color-borde);
    border-radius: var(--radio-borde);
    overflow: hidden;
    margin-top: 1.2rem;
    background: var(--color-fondo-suave);
  }
  .map-embed iframe { width: 100%; height: 100%; border: 0; display: block; }
  .map-address {
    font-size: 0.9rem;
    color: var(--color-texto-suave);
    margin-top: 0.9rem;
  }
  .map-address a { color: var(--color-acento); text-decoration: none; }
  .map-address a:hover { text-decoration: underline; }

  /* ---------- FOOTER ---------- */
  footer {
    padding: 2.5rem 0 3rem;
    font-size: 0.85rem;
    color: var(--color-texto-suave);
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--color-borde);
  }
  footer a { color: var(--color-texto-suave); text-decoration: none; }
  footer a:hover { color: var(--color-acento); }

  /* ---------- MOBILE ---------- */
  @media (max-width: 640px) {
    .hero { padding: 3rem 0 2rem; }
    .hero h1 { font-size: 1.65rem; }
    section.block { padding: 2.5rem 0; }
    .slot { grid-template-columns: 1fr; gap: 0.3rem; }
    .slot time { font-size: 0.8rem; }
    .nav-brand { display: none; }
    .nav-inner { padding: 0.7rem 1.2rem; justify-content: center; }
  }
</style>
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="nav-inner">
    <a href="#top" class="nav-brand" id="nav-brand"></a>
    <ul class="nav-links" id="nav-links"></ul>
  </div>
</nav>

<!-- HERO -->
<header class="hero" id="top">
  <div class="wrap">
    <h1 id="hero-titulo"></h1>
    <p class="meta" id="hero-meta"></p>
  </div>
</header>

<!-- EVENTO -->
<section class="block" id="evento">
  <div class="wrap">
    <h2>Evento</h2>
    <p class="lead" id="evento-desc"></p>
  </div>
</section>

<!-- AGENDA -->
<section class="block" id="agenda">
  <div class="wrap">
    <h2>Agenda</h2>
    <div class="days" id="days"></div>
    <div id="agenda-container"></div>
  </div>
</section>

<!-- PONENTES -->
<section class="block" id="ponentes">
  <div class="wrap">
    <h2>Ponentes</h2>
    <div id="ponentes-container"></div>
  </div>
</section>

<!-- INSCRIPCIONES -->
<section class="block" id="inscripciones">
  <div class="wrap">
    <h2 id="insc-titulo">Inscripciones</h2>
    <p class="lead" id="insc-desc"></p>
    <div class="insc-items" id="insc-items"></div>
    <a href="#" class="btn" id="insc-boton"></a>
  </div>
</section>

<!-- MAPA -->
<section class="block" id="mapa">
  <div class="wrap">
    <h2 id="mapa-titulo">Cómo llegar</h2>
    <p class="lead" id="mapa-desc"></p>
    <div class="map-embed" id="mapa-embed"></div>
    <p class="map-address" id="mapa-address"></p>
  </div>
</section>

<!-- FOOTER -->
<footer>
  <div class="wrap" style="display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;align-items:center;width:100%;">
    <span id="footer-texto"></span>
    <span id="footer-enlaces"></span>
  </div>
</footer>

<script>
  const $ = id => document.getElementById(id);
  const el = (tag, cls) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    return n;
  };

  /* -------- TEMA -------- */
  function aplicarTema(t) {
    if (!t) return;
    const root = document.documentElement;
    const map = {
      colorAcento: '--color-acento',
      colorTexto: '--color-texto',
      colorTextoSuave: '--color-texto-suave',
      colorFondo: '--color-fondo',
      colorFondoSuave: '--color-fondo-suave',
      colorBorde: '--color-borde',
      fuente: '--fuente',
      anchoMaximo: '--ancho-maximo',
      radioBorde: '--radio-borde'
    };
    Object.entries(map).forEach(([k, v]) => {
      if (t[k]) root.style.setProperty(v, t[k]);
    });
  }

  /* -------- EVENTO / HERO / NAV -------- */
  function renderEvento(ev, nav) {
    document.title = ev.titulo;
    $('hero-titulo').textContent = ev.titulo;
    const meta = $('hero-meta');
    meta.innerHTML = '';
    [ev.fechas, ev.lugar].filter(Boolean).forEach(txt => {
      const s = el('span');
      s.textContent = txt;
      meta.appendChild(s);
    });

    $('nav-brand').textContent = ev.tituloCorto || ev.titulo;
    $('evento-desc').textContent = ev.descripcion || '';

    const links = $('nav-links');
    links.innerHTML = '';
    nav.forEach(item => {
      const li = el('li');
      const a = el('a');
      a.href = '#' + item.ancla;
      a.textContent = item.etiqueta;
      li.appendChild(a);
      links.appendChild(li);
    });
  }

  /* -------- AGENDA -------- */
  function renderAgenda(agenda) {
    const daysBar = $('days');
    const cont = $('agenda-container');

    agenda.forEach((dia, i) => {
      const btn = el('button', i === 0 ? 'active' : '');
      btn.textContent = dia.etiqueta;
      btn.addEventListener('click', () => {
        daysBar.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        cont.querySelectorAll('.day').forEach(d => d.classList.remove('active'));
        btn.classList.add('active');
        $('day-' + dia.id).classList.add('active');
      });
      daysBar.appendChild(btn);

      const dayDiv = el('div', 'day' + (i === 0 ? ' active' : ''));
      dayDiv.id = 'day-' + dia.id;

      dia.bloques.forEach(bloque => {
        const slot = el('div', 'slot');
        if (bloque.tipo) slot.dataset.tipo = bloque.tipo;

        const time = el('time');
        time.textContent = bloque.hora;
        slot.appendChild(time);

        const body = el('div', 'slot-body');
        if (bloque.items.length > 1) body.classList.add('split');

        bloque.items.forEach(item => {
          const div = el('div', 'item');
          const h3 = el('h3');
          h3.textContent = item.titulo;
          div.appendChild(h3);

          const meta = [item.ponente, item.lugar].filter(Boolean).join(' · ');
          if (meta) {
            const p = el('p');
            p.textContent = meta;
            div.appendChild(p);
          }
          if (item.nota) {
            const n = el('p', 'nota');
            n.textContent = item.nota;
            div.appendChild(n);
          }
          body.appendChild(div);
        });

        slot.appendChild(body);
        dayDiv.appendChild(slot);
      });

      cont.appendChild(dayDiv);
    });
  }

  /* -------- PONENTES -------- */
  function renderPonentes(lista) {
    const cont = $('ponentes-container');
    lista.forEach(p => {
      const div = el('div', 'speaker');
      const h3 = el('h3');
      h3.textContent = p.nombre;
      div.appendChild(h3);

      const c = el('span', 'country');
      c.textContent = p.pais;
      div.appendChild(c);

      if (p.bio) {
        const bio = el('p');
        bio.textContent = p.bio;
        div.appendChild(bio);
      }
      cont.appendChild(div);
    });
  }

  /* -------- INSCRIPCIONES -------- */
  function renderInscripciones(insc) {
    if (!insc) return;
    if (insc.titulo) $('insc-titulo').textContent = insc.titulo;
    $('insc-desc').textContent = insc.descripcion || '';

    const cont = $('insc-items');
    (insc.items || []).forEach(item => {
      const div = el('div', 'insc-item');
      const h3 = el('h3');
      h3.textContent = item.titulo;
      div.appendChild(h3);
      if (item.detalle) {
        const p = el('p');
        p.textContent = item.detalle;
        div.appendChild(p);
      }
      cont.appendChild(div);
    });

    const btn = $('insc-boton');
    if (insc.botonTexto && insc.botonUrl) {
      btn.textContent = insc.botonTexto;
      btn.href = insc.botonUrl;
      btn.style.display = 'inline-block';
      if (insc.botonUrl.startsWith('http')) {
        btn.target = '_blank';
        btn.rel = 'noopener';
      }
    } else {
      btn.style.display = 'none';
    }
  }

  /* -------- MAPA -------- */
  function renderMapa(m) {
    if (!m) return;
    if (m.titulo) $('mapa-titulo').textContent = m.titulo;
    $('mapa-desc').textContent = m.descripcion || '';

    const cont = $('mapa-embed');
    if (m.embedUrl) {
      const iframe = document.createElement('iframe');
      iframe.src = m.embedUrl;
      iframe.loading = 'lazy';
      iframe.referrerPolicy = 'no-referrer-when-downgrade';
      iframe.allowFullscreen = true;
      cont.appendChild(iframe);
      cont.style.display = 'block';
    } else {
      cont.style.display = 'none';
    }

    const addr = $('mapa-address');
    addr.innerHTML = '';
    if (m.direccion || m.enlaceExterno) {
      if (m.direccion) addr.textContent = m.direccion + ' ';
      if (m.enlaceExterno) {
        const a = el('a');
        a.href = m.enlaceExterno;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = 'Abrir en Google Maps →';
        addr.appendChild(a);
      }
    }
  }

  /* -------- FOOTER -------- */
  function renderFooter(f) {
    if (!f) return;
    $('footer-texto').textContent = f.texto || '';
    const cont = $('footer-enlaces');
    (f.enlaces || []).forEach(e => {
      const a = el('a');
      a.href = e.url;
      a.textContent = e.etiqueta;
      a.style.marginLeft = '1rem';
      cont.appendChild(a);
    });
  }

  /* -------- CARGA -------- */
  fetch('datos.json?v=' + Date.now())
    .then(res => res.json())
    .then(data => {
      aplicarTema(data.tema);
      renderEvento(data.evento, data.navegacion || []);
      renderAgenda(data.agenda || []);
      renderPonentes(data.ponentes || []);
      renderInscripciones(data.inscripciones);
      renderMapa(data.mapa);
      renderFooter(data.footer);
    })
    .catch(err => {
      document.body.insertAdjacentHTML('afterbegin',
        '<p style="padding:1rem;background:#fee2e2;color:#991b1b;font-family:sans-serif;">No se pudo cargar <code>datos.json</code>. Ábrelo desde GitHub Pages o un servidor local (no con doble clic).</p>');
      console.error(err);
    });
</script>

</body>
</html>
